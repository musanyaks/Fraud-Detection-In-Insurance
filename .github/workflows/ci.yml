name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    container: rocker/r-ver:4.4.1

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev

      - name: Install R packages
        run: |
          Rscript -e "
            install.packages(c(
              'dplyr', 'ranger', 'pROC', 'plumber', 'R6', 'yaml',
              'logger', 'vip', 'checkmate', 'jsonlite', 'testthat',
              'purrr', 'tidyr', 'rlang', 'data.table'
            ), repos='https://cloud.r-project.org/')
          "

      - name: Run tests
        run: |
          Rscript -e "testthat::test_dir('tests/testthat')"

      - name: Check package can be loaded
        run: |
          Rscript -e "source('R/config.R'); source('R/schema.R'); cat('All modules load OK!\n')"