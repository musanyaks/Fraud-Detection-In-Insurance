steps:
  - name: Checkout code
    uses: actions/checkout@v4

  - name: Setup R
    uses: r-lib/actions/setup-r@v2
    with:
      r-version: '4.4.1'

  - name: Install system dependencies for R packages
    run: |
      sudo apt-get update
      sudo apt-get install -y --no-install-recommends \
        libuv1-dev \
        libsodium-dev \
        zlib1g-dev \
        libxml2-dev \
        libssl-dev \
        libcurl4-openssl-dev \
        pkg-config \
        build-essential

  - name: Install dependencies
    run: |
      Rscript -e "install.packages(c('dplyr','ranger','pROC','plumber','R6','yaml','logger','vip','checkmate','jsonlite','testthat'), repos='https://cloud.r-project.org/')"

  - name: Run tests
    run: |
      Rscript -e "r_files <- list.files('R', pattern = '\\.R$', full.names = TRUE); invisible(lapply(r_files, source)); testthat::test_dir('tests/testthat')"
